server:
  port: ${SERVER_PORT:8080}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [traceId=%X{traceId:-}] %logger{36} - %msg%n"

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id

springdoc:
  swagger-ui:
    path: /swagger-ui.html

spring:
  application:
    name: flash-sale
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    time-zone: Asia/Shanghai
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 4
    baseline-description: Existing schema before Flyway

flash-sale:
  order:
    pay-timeout-minutes: 15
  seckill:
    rate-limit-seconds: 1
    rate-limit-count: 3
    user-marker-extra-minutes: 10
  cache:
    product-detail-minutes: 30
    activity-detail-minutes: 30
    empty-value-minutes: 2
    rebuild-lock-seconds: 10
    rebuild-retry-times: 3
    rebuild-retry-interval-ms: 50
    db-fallback-max-concurrency: 20
  task:
    order-timeout-fixed-delay-ms: 5000
    order-timeout-batch-size: 100
    stock-compensation-initial-delay-ms: 60000
    stock-compensation-fixed-delay-ms: 60000
    scheduled-lock-ttl-ms: 30000
  thread-pool:
    order-core-size: 4
    order-max-size: 8
    order-queue-capacity: 100
    order-keep-alive-seconds: 60
    order-thread-name-prefix: order-task-
  mq:
    order-max-retry-count: 3
    order-retry-delay-ms: 5000
    send-max-retry-count: 3
    send-retry-fixed-delay-ms: 5000
    send-retry-batch-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized